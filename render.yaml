services:
  - type: web
    name: errorz-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PRECHECK
        value: ""
    healthCheckPath: /
    autoDeploy: true
